# /etc/nginx/sites-available/portfolio  (then: ln -s ../sites-available/portfolio /etc/nginx/sites-enabled/)
# certbot --nginx adds the HTTPS listener and the http -> https redirect to this block.
# Flood guard for the chat in front of PHP: about 10 a minute per IP with a burst of 5.
# Laravel's own limits (6 a minute, 60 a day, 1500 a day site-wide) are the real ones.
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

# no nginx version on error pages or in the Server header, here so it also covers certbot's redirect block
server_tokens off;

# A full content policy for the React site, report-only for now: break nothing, just log violations
# in the browser console. Filament/Livewire need inline and eval'd scripts, so /admin is left out.
# wasm-unsafe-eval: the chibi's mesh decoder; blob: the textures packed inside the .glb.
map $uri $csp_report_only {
    ~^/admin "";
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/portfolio;
    client_max_body_size 1m;

    # Security headers. nginx drops these in any location with its own add_header,
    # so the two locations below that set Cache-Control repeat them.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Content-Security-Policy-Report-Only $csp_report_only always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static files: the React build first, then Laravel/Filament's public assets, else Laravel.
    # Only these two folders are ever served directly, so the rest of the repo stays private.
    location / {
        try_files /dist$uri /backend/public$uri @laravel;
    }

    location = / {
        try_files /dist/index.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Vite's hashed bundles never change, so browsers can keep them for good
    location /assets/ {
        try_files /dist$uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # never hand out PHP source as a static file
    location ~ \.php$ {
        return 404;
    }

    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portfolio/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 120;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portfolio/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 120; # chat replies stream for several seconds
        # streaming also relies on Laravel sending X-Accel-Buffering: no on /api/chat
    }
}
