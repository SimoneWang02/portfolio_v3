# /etc/nginx/sites-available/portfolio  (then: ln -s ../sites-available/portfolio /etc/nginx/sites-enabled/)
# certbot --nginx adds the HTTPS listener and the http -> https redirect to this block.
# Flood guard for the chat in front of PHP: about 10 a minute per IP with a burst of 5.
# Laravel's own limits (6 a minute, 60 a day, 1500 a day site-wide) are the real ones.
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/portfolio;
    client_max_body_size 1m;

    # Static files: the React build first, then Laravel/Filament's public assets, else Laravel.
    # Only these two folders are ever served directly, so the rest of the repo stays private.
    location / {
        try_files /dist$uri /backend/public$uri @laravel;
    }

    location = / {
        try_files /dist/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed bundles never change, so browsers can keep them for good
    location /assets/ {
        try_files /dist$uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # never hand out PHP source as a static file
    location ~ \.php$ {
        return 404;
    }

    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portfolio/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 120;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portfolio/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 120; # chat replies stream for several seconds
        # streaming also relies on Laravel sending X-Accel-Buffering: no on /api/chat
    }
}
